# Minimal 3-tier example topology for the generic-prometheus preset.
services:
  api:
    kind: http
    upstream: []
    downstream: [app]
    description: "Edge / API gateway"

  app:
    kind: monolith
    upstream: [api]
    downstream: [postgres, redis]
    description: "Application service"

  postgres:
    kind: database
    upstream: [app]
    downstream: []
    log_services: [app]
    description: "Primary database"

  redis:
    kind: redis
    upstream: [app]
    downstream: []
    log_services: [app]
    description: "Cache"

module_dependencies: {}
