# Service dependency map for publishi.ai.
#
# publishi.ai is a MODULAR MONOLITH (platform-service) behind an API Gateway,
# not a microservice mesh. So "upstream/downstream" is modeled as:
#   - process-level edges (gateway -> platform-service)
#   - backing dependencies (postgres, redis, elasticsearch, s3, openai, ...)
#   - logical modules inside platform-service (auth, content, media, ...)
#
# The agent uses this to answer "what else might be broken?" (blast radius).
# `kind` keys into app/clients/promql.py::DEPENDENCY_PROBES for extra metrics.

services:
  api-gateway:
    kind: gateway
    upstream: []
    downstream: [platform-service]
    description: "Spring Cloud Gateway (WebFlux); single entry point on :8000"

  platform-service:
    kind: monolith
    upstream: [api-gateway]
    downstream:
      - postgres
      - redis
      - elasticsearch
      - s3
      - openai
      - smtp
      - twilio
    modules: [auth, content, media, search, ai, notification, analytics]
    description: "Modular monolith on :8080; aggregates all backend modules"

  postgres:
    kind: database
    upstream: [platform-service]
    downstream: []
    description: "Primary relational store; accessed via HikariCP pool"

  redis:
    kind: redis
    upstream: [platform-service]
    downstream: []
    description: "Cache + session store (Lettuce client)"

  elasticsearch:
    kind: search
    upstream: [platform-service]
    downstream: []
    description: "Search index; backs the `search` module"

  s3:
    kind: object-store
    upstream: [platform-service]
    downstream: []
    description: "Media/object storage; backs the `media` module"

  openai:
    kind: external-api
    upstream: [platform-service]
    downstream: []
    description: "External LLM provider; backs the `ai` module"

  smtp:
    kind: external-api
    upstream: [platform-service]
    downstream: []
    description: "Outbound email; backs the `notification` module"

  twilio:
    kind: external-api
    upstream: [platform-service]
    downstream: []
    description: "SMS/voice; backs the `notification` module"

# Maps a logical module (from log logger_name prefix c.p.<module>) to its
# primary backing dependencies, so a module alert can expand its blast radius.
module_dependencies:
  auth: [postgres, redis]
  content: [postgres, elasticsearch]
  media: [postgres, s3]
  search: [elasticsearch]
  ai: [openai, postgres]
  notification: [smtp, twilio, redis]
  analytics: [postgres]
