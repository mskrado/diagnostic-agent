[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostic-agent"
version = "0.1.0"
description = "Config-driven reactive diagnostic agent for Prometheus alerts (LangGraph + RAG runbooks)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "diagnostic-agent contributors" }]
keywords = ["observability", "prometheus", "loki", "langgraph", "diagnostics", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-ollama>=0.2",
  "langchain-openai>=0.2",
  "langchain-aws>=0.2",
  "langchain-anthropic>=0.2",
  "langchain-google-genai>=2",
  "langchain-chroma>=0.1",
  "chromadb>=0.5",
  "prometheus-api-client>=0.5",
  "httpx>=0.27",
  "requests>=2.31",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/mskrado/diagnostic-agent"
Documentation = "https://github.com/mskrado/diagnostic-agent#readme"
Issues = "https://github.com/mskrado/diagnostic-agent/issues"
Repository = "https://github.com/mskrado/diagnostic-agent"

[project.scripts]
diagnostic-agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "profile/presets/**/*.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "e2e: live end-to-end tests against a running agent",
]
