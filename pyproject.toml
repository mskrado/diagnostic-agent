[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostic-agent"
version = "0.1.0"
description = "Config-driven reactive diagnostic agent for Prometheus alerts (LangGraph + RAG runbooks)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "diagnostic-agent contributors" }]
keywords = ["observability", "prometheus", "loki", "langgraph", "diagnostics", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
# Read from requirements*.txt so Docker/CI (`pip install -r`) and packaging
# (`pip install .[dev]`) can never drift apart.
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[project.urls]
Homepage = "https://github.com/mskrado/diagnostic-agent"
Documentation = "https://github.com/mskrado/diagnostic-agent#readme"
Issues = "https://github.com/mskrado/diagnostic-agent/issues"
Repository = "https://github.com/mskrado/diagnostic-agent"

[project.scripts]
diag = "app.cli:main"
diagnostic-agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "profile/presets/**/*.yaml",
]

# Sole pytest config (there is deliberately no pytest.ini — pytest.ini would
# take precedence and silently disable everything below).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
