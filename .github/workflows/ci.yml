name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests
        run: pytest -q -m "not e2e"
      - name: Corpus lint (no LLM)
        run: python scripts/corpus_lint.py
      - name: Profile health-check
        run: |
          export AGENT_PROFILE_DIR=$PWD/examples/hello-world
          export AGENT_DEFAULT_PRESET=generic-prometheus
          diagnostic-agent health-check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t diagnostic-agent:ci .
