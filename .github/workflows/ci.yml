name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

jobs:
  # Soft label hygiene (devel PRs). Release notes group by type:*/area:* labels;
  # missing labels dump everything into "Other Changes". Advisory only.
  label-hygiene:
    name: Release-label hygiene
    if: github.event_name == 'pull_request' && (github.base_ref == 'devel' || github.base_ref == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for type:* (or ignore-for-release)
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            const ok = labels.some(n =>
              n === 'ignore-for-release' ||
              n.startsWith('type:') ||
              n === 'release'
            );
            const marker = '<!-- release-label-hygiene -->';
            const body = [
              marker,
              '## Release-label hygiene',
              '',
              ok
                ? '✅ This PR has a `type:*` / `ignore-for-release` / `release` label — release notes can categorize it.'
                : [
                    '⚠️ **Missing release category label.**',
                    '',
                    'PRs merged into `devel` should carry at least one of:',
                    '- `type:feature` · `type:bug` · `type:tech-debt` · `type:docs`',
                    '- or `ignore-for-release` (changelog / chore noise)',
                    '',
                    'Without a label, `scripts/generate-release-notes.sh` lists the PR under **Other Changes**.',
                    'This check is advisory and does not fail the PR.',
                  ].join('\n'),
              '',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (!ok) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            if (!ok) {
              core.notice('PR is missing a type:* / ignore-for-release label (advisory).');
            }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Requirements lock drift
        run: |
          pip install pip-tools
          # Seed the output with the committed lock so pip-compile honours the
          # existing pins. Resolving into an empty file would pick the newest
          # release of every dependency, so this job would fail whenever an
          # upstream package published -- not when the lock actually drifted.
          cp requirements.lock requirements.lock.check
          pip-compile requirements.txt -o requirements.lock.check --strip-extras --quiet
          python scripts/check-lock-drift.py requirements.lock requirements.lock.check
      # This repository is itself a workspace, so CI runs the host-facing
      # commands against it — the same code path a host project uses.
      - name: Corpus lint (no LLM)
        run: diag lint
      - name: Validate bundled example workspaces
        run: |
          diag validate -w examples/hello-world
          diag validate -w examples/spring-modular-monolith
      - name: Profile health-check
        run: diag health-check -w examples/hello-world

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t diagnostic-agent:ci .
