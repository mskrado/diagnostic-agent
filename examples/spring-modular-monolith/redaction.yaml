# Tenant / PII redaction for multi-tenant Spring hosts.
#
# `extends` pulls in the base preset's secret scrubbing (bearer tokens, AWS
# keys); rules below are appended. Reuse a parent rule's `name` to override it.
extends: generic-prometheus

rules:
  - name: tenant_kv
    pattern: '("?tenant[_-]?id"?\s*[:=]\s*")[^"]*(")'
    replacement: '\1[REDACTED]\2'
    flags: IGNORECASE
  - name: tenant_token
    pattern: '\btenant-[0-9a-zA-Z]+\b'
    replacement: 'tenant-[REDACTED]'
    flags: IGNORECASE
  - name: uuid
    pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'
    replacement: '[UUID-REDACTED]'
    flags: IGNORECASE
