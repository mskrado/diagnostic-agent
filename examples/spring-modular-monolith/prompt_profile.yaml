extends: generic-prometheus

platform_description: >-
  a Spring Boot modular monolith (`platform-service`) behind an `api-gateway`,
  with backing dependencies: postgres, redis, elasticsearch, s3, openai, smtp,
  twilio. Observability is Prometheus + Loki on the compose host
  (localhost:9090 / localhost:3100). JDBC/Hikari and most dependency errors
  appear in `platform-service` logs — many dependencies have no Loki stream of
  their own. Prefer verifying container image/health before assuming a named
  database process is actually running (placeholders/stubs are possible).
  Everything runs as Docker containers on one host whose small root volume
  also holds `/var/lib/docker`; each deploy pulls a new release image tag, so
  image history is a prime suspect for host disk alerts.

tool_run_hints: |-
  Where to run: copy-paste on the compose HOST unless a command uses
  docker exec / in-network DNS. Prom=http://localhost:9090 Loki=http://localhost:3100.

  Naming planes (never mix):
  | alert/Prom/Loki service= | compose key | container name (docker logs/inspect) |
  | platform-service | platform-service | <prefix>-platform (see docker ps) |
  | api-gateway | api-gateway | <prefix>-api-gateway |
  | postgres (alert label only) | postgres | <prefix>-postgres |
  | redis | redis | <prefix>-redis |
  Replace <prefix> with the real compose project prefix from `docker ps`
  (e.g. acme). If unknown, prefer `docker compose ps` / `docker ps`
  over inventing names.

  Hard rules:
  - Use alert `service=` (and service_map log_services) for LogQL/PromQL filters.
  - Postgres/redis/elasticsearch errors: query `{service="platform-service"}`,
    NOT `{service="postgres"}` / `{service="redis"}` unless logs exist there.
  - `docker logs` / `docker inspect` / `docker exec` → container names only.
  - `docker compose …` → compose keys only, from the stack's compose directory.
  - Do not invent host ports. Actuator on platform is often only inside the
    container network (:8080), not published on the host — use
    `docker exec <platform-container> wget -qO- http://127.0.0.1:8080/actuator/health`
    or the gateway published port when that is what operators use.
  - Never suggest `curl http://localhost:5432/health` (Postgres is not HTTP).
  - Prefer `docker inspect <db-container> --format '{{.Config.Image}} {{.State.Health.Status}} {{json .Config.Cmd}}'`
    before `docker logs` when DB connectivity fails — confirm it is a real DB image.
  - psql/redis-cli only via `docker exec` into the real dependency container
    (or documented host client); never assume host-local sockets.
  - Verification before remediation; mark restarts as disruptive.
  - Host disk alerts (HostDiskSpaceLow / HostDiskSpaceCritical /
    HostDiskFillPredicted): cite disk_* and docker_* metric values from the
    snapshot. If docker_images_reclaimable_bytes is a large share of used
    space, make Docker image history its own category. Suggest
    `docker image prune` before `-a`, and keep the running tag plus 2–3
    rollback tags; never suggest `docker volume prune` or
    `docker system prune --volumes` without review.

  Golden commands (adapt <prefix> / paths to this host):
  - curl -sG 'http://localhost:9090/api/v1/query' --data-urlencode 'query=hikaricp_connections_pending{service="platform-service"}'
  - curl -sG 'http://localhost:9090/api/v1/query' --data-urlencode 'query=hikaricp_connections_active{service="platform-service"}'
  - curl -sG 'http://localhost:3100/loki/api/v1/query_range' --data-urlencode 'query={service="platform-service"} |~ "(?i)postgres|PSQLException|hikari|jdbc"' --data-urlencode 'limit=20'
  - docker ps --format '{{.Names}} {{.Status}}' | findstr /i "platform postgres redis"   # Windows host
  - docker ps --format '{{.Names}} {{.Status}}' | grep -Ei 'platform|postgres|redis'     # Linux host
  - docker inspect <prefix>-postgres --format 'image={{.Config.Image}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'
  - docker logs <prefix>-postgres --tail 100
  - docker logs <prefix>-platform --tail 100
  - docker compose ps postgres platform-service
  - docker exec <prefix>-platform wget -qO- http://127.0.0.1:8080/actuator/health
  - df -h / && df -i /
  - sudo du -xsh /var/lib/docker /var/log /var/cache /home 2>/dev/null | sort -h
  - docker system df
  - docker images --format '{{.Repository}}' | sort | uniq -c | sort -rn
  - docker images -f dangling=true
  - docker ps --format '{{.Image}}' | sort -u

  FORBIDDEN (do not emit):
  - docker logs postgres
  - docker logs redis
  - curl -sf http://localhost:8080/actuator/health
  - curl -sf http://localhost:5432/health
  - psql -U postgres … on the host socket without docker exec
  - LogQL {service="postgres"} or {service="redis"} for JDBC/cache errors
  - docker system prune -a --volumes
